[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neurobots-backend"
version = "0.1.0"
description = "Edge-first clinical decision-support backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<0.117",
    "google-genai>=2.6,<3",
    "langgraph>=1.2,<1.3",
    "joblib>=1.4,<2",
    "llvmlite>=0.44,<1",
    "numba>=0.61,<1",
    "networkx>=3.4,<4",
    "numpy>=2.1,<2.2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "scikit-learn>=1.6,<2",
    "shap>=0.47,<1",
    "sqlalchemy>=2.0.41,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
